name: Compilation et tests

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# Un nouvel envoi annule la compilation en cours de la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ubuntu 24.04, OpenCascade 7.6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libtbb-dev catch2 nlohmann-json3-dev \
            libfontconfig-dev libx11-dev qt6-base-dev libgl-dev libglu1-mesa-dev xvfb xauth libgl1-mesa-dri \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-data-exchange-dev libocct-foundation-dev libocct-visualization-dev
      - name: Configuration
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compilation
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Essai de l'application avec capture d'écran
        if: hashFiles('app/CMakeLists.txt') != ''
        run: xvfb-run -a -s "-screen 0 1600x1000x24" build/app/Promethee --essai --capture capture-linux.png
      - name: Capture
        if: hashFiles('capture-linux.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: capture-linux
          path: capture-linux.png

  windows:
    name: Windows (MSVC, vcpkg, OpenCascade 8)
    runs-on: windows-2022
    env:
      VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Récupération des paquets vcpkg déjà compilés
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-
      - name: vcpkg à une version figée
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $env:VCPKG_COMMIT
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
      - name: Dépendances (compile OpenCascade au premier passage, environ une heure)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sauvegarde des paquets compilés, même en cas d'échec plus loin
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
      - name: Configuration
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_INSTALL=OFF -DVCPKG_INSTALLED_DIR="${{ github.workspace }}\vcpkg_installed" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Compilation
        run: cmake --build build --config Release
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Paquet de l'application, prêt à lancer
        if: hashFiles('app/CMakeLists.txt') != ''
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --compiler-runtime build\app\Release\Promethee.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path paquet\Promethee | Out-Null
          Copy-Item -Recurse build\app\Release\* paquet\Promethee\
          Copy-Item LICENSE, TIERS.md paquet\Promethee\
      - name: Envoi du paquet
        if: hashFiles('app/CMakeLists.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Promethee-Windows
          path: paquet

  macos:
    name: macOS (Apple Silicon, Homebrew)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: brew install ninja opencascade nlohmann-json catch2 qt
      - name: Configuration
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)"
      - name: Compilation
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
